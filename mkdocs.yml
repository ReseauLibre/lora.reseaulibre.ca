---
site_name: Mesh Montréal
site_url: https://lora.reseaulibre.ca
site_description: The Montreal mesh project"
site_author: Anarcat and others
copyright: Copyleft &copy; CC-BY-SA 4.0
repo_url: https://codeberg.org/anarcat/lora-reseaulibre-ca
edit_uri: _edit/main/docs/
# nav:
#   - About: index.md
#   - Guides: guides.md
#   - References: references.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    # - navigation.prune
    # - navigation.sections
    # - navigation.expand
    - navigation.tabs
    - navigation.tabs.sticky
    # - navigation.top
    # - navigation.tracking
    - content.action.edit  # Edit this page
    # broken, it points to _raw, it's raw in codeberg
    # - content.action.view  # View source of this page
  # disable the roboto font download from google
  font: false
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
  # the site is in english
  language: en

# i thought this would help in translating it all, but it's not the
# way: those are just fixed links.
#
# in mkdocs, this is done with the mkdocs-static-i18n plugin:
# https://ultrabug.github.io/mkdocs-static-i18n/
#
# in zensical, this is the first issue in the backlog:
# https://github.com/zensical/backlog/issues/1
#
# it's blocked by the second one, the design of the module system:
# https://github.com/zensical/backlog/issues/41
extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: Français
      link: /fr/
      lang: fr
plugins:
  - search
  # show page authors at the bottom
  # disabled because for now we only have a single author
  # - git-authors
  # show git modification date
  - git-revision-date-localized:
      type: iso_datetime
      enable_creation_date: true
